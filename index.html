<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vietlott Super AI Predictor Pro</title>
    <!-- Nhúng thư viện TensorFlow.js từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            color: #38bdf8;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .status-box {
            background: #090d16;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            color: #fbbf24;
            margin-bottom: 20px;
            font-size: 13px;
        }
        button {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .result-container {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .ball {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ec4899;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VIETLOTT SUPER AI PRO (Self-Attention Model)</h1>
    
    <div class="status-box" id="statusLog">
        Engine: Trạng thái chờ khởi tạo...
    </div>

    <button id="btnPredict" onclick="handlePrediction()">KÍCH HOẠT SUPER AI DỰ ĐOÁN</button>

    <div id="results" style="margin-top: 25px;"></div>
</div>

<script>
    const statusLog = document.getElementById('statusLog');
    const btnPredict = document.getElementById('btnPredict');

    // 1. Khởi tạo TensorFlow.js an toàn, tránh đơ UI
    async function initTensorFlow() {
        try {
            await tf.ready();
            // Thử dùng webgl, nếu đơ/lỗi có thể đổi sang 'cpu' bằng lệnh: await tf.setBackend('cpu');
            statusLog.innerText = `[Engine: ${tf.getBackend().toUpperCase()}] Status: Đã sẵn sàng.`;
        } catch (e) {
            statusLog.innerText = "Lỗi khởi tạo TensorFlow.js, đang chuyển sang CPU...";
            await tf.setBackend('cpu');
            statusLog.innerText = "[Engine: CPU] Status: Đã sẵn sàng.";
        }
    }

    // 2. Thuật toán Self-Attention được bọc bằng tf.tidy và yield nhường luồng cho UI
    async function runSelfAttentionModel(sampleData, dModel = 8) {
        // Cập nhật trạng thái hiển thị trên giao diện
        statusLog.innerText = "[Engine: WEBGL] Status: Xây dựng Self-Attention Layer...";
        
        // Cho trình duyệt 1 nhịp nghỉ (yield) để vẽ UI, tránh bị treo
        await tf.nextFrame();

        // Sử dụng tf.tidy để tự động giải phóng toàn bộ ma trận trung gian (Q, K, V, Scores)
        const predictionTensor = tf.tidy(() => {
            const inputTensor = tf.tensor(sampleData); // [Batch, SeqLen, Features]

            // Khởi tạo các ma trận trọng số
            const Wq = tf.randomNormal([inputTensor.shape[2], dModel]);
            const Wk = tf.randomNormal([inputTensor.shape[2], dModel]);
            const Wv = tf.randomNormal([inputTensor.shape[2], dModel]);

            // Tính Q, K, V
            const Q = tf.matMul(inputTensor, Wq);
            const K = tf.matMul(inputTensor, Wk);
            const V = tf.matMul(inputTensor, Wv);

            // Self-Attention: Softmax((Q * K^T) / sqrt(d_k)) * V
            const scores = tf.matMul(Q, K, false, true);
            const scaledScores = tf.div(scores, tf.sqrt(tf.scalar(dModel)));
            const attentionWeights = tf.softmax(scaledScores);

            const attentionOutput = tf.matMul(attentionWeights, V);

            // Trả về kết quả trung bình để lấy ra con số dự đoán
            return tf.mean(attentionOutput, 1);
        });

        // Lấy dữ liệu mảng từ Tensor
        const rawValues = await predictionTensor.array();
        
        // Giải phóng tensor kết quả cuối cùng
        predictionTensor.dispose();

        return rawValues;
    }

    // 3. Xử lý khi bấm nút "Kích Hoạt Super AI Dự Đoán"
    async function handlePrediction() {
        btnPredict.disabled = true;
        btnPredict.innerText = "Đang phân tích...";

        // Dữ liệu giả định mẫu để tính toán
        const mockHistoryData = [
            [[5, 12, 18, 24, 33, 40], [1, 9, 15, 22, 31, 42]],
            [[2, 11, 19, 25, 30, 44], [4, 8, 16, 21, 35, 41]]
        ];

        try {
            // Chạy mô hình phân tích
            const output = await runSelfAttentionModel(mockHistoryData);

            // Chuyển kết quả tính toán thành bộ số 6 con số (từ 1 đến 45)
            const numbers = Array.from({ length: 6 }, (_, i) => {
                const val = Math.abs(Math.floor((output[0][i % output[0].length] || Math.random()) * 100)) % 45 + 1;
                return val;
            });

            // Hiển thị kết quả ra màn hình
            displayResults(numbers);
            statusLog.innerText = "[Engine: WEBGL] Status: Đã hoàn tất dự đoán mượt mà!";
        } catch (error) {
            console.error(error);
            statusLog.innerText = "Có lỗi xảy ra trong quá trình tính toán. Hãy thử lại.";
        } finally {
            btnPredict.disabled = false;
            btnPredict.innerText = "KÍCH HOẠT SUPER AI DỰ ĐOÁN";
        }
    }

    // 4. Hiển thị các quả bóng số ra màn hình
    function displayResults(numbers) {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '<h3>Bộ Số Dự Đoán:</h3><div class="result-container"></div>';
        const container = resultsDiv.querySelector('.result-container');

        numbers.forEach(num => {
            const ball = document.createElement('div');
            ball.className = 'ball';
            ball.innerText = num < 10 ? '0' + num : num;
            container.appendChild(ball);
        });
    }

    // Tự động chạy khởi tạo khi tải trang
    window.onload = initTensorFlow;
</script>

</body>
</html>
